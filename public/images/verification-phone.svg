<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Teléfono de verificación</title>
  <desc id="desc">Teléfono con código de verificación de tres asteriscos.</desc>
  <defs>
    <linearGradient id="phone-gradient" x1="30" y1="15" x2="68" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#244DEB"/>
      <stop offset=".55" stop-color="#543BE7"/>
      <stop offset="1" stop-color="#7A3EE0"/>
    </linearGradient>
    <filter id="phone-shadow" x="22" y="9" width="52" height="79" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dy="3" stdDeviation="2.5" flood-color="#4B39D6" flood-opacity=".2"/>
    </filter>
  </defs>

  <!-- Puntos decorativos -->
  <circle cx="23" cy="24" r="5" fill="#EEF0FF"/>
  <circle cx="16" cy="48" r="3" fill="#DDE2FF"/>
  <circle cx="23" cy="61" r="5" fill="#E7E9FF"/>
  <circle cx="72" cy="22" r="3" fill="#E4E6FF"/>
  <circle cx="79" cy="43" r="5" fill="#EEF0FF"/>
  <circle cx="73" cy="63" r="3" fill="#DFE3FF"/>
  <circle cx="10" cy="55" r="2.5" fill="#6A6AFA"/>
  <circle cx="14" cy="45" r="2" fill="#A7B2FF"/>
  <circle cx="84" cy="54" r="2.5" fill="#AEB7FF"/>

  <!-- Teléfono -->
  <g filter="url(#phone-shadow)">
    <rect x="26" y="16" width="44" height="62" rx="9" fill="white" stroke="url(#phone-gradient)" stroke-width="4"/>
    <path d="M43 23h10" stroke="url(#phone-gradient)" stroke-width="3" stroke-linecap="round"/>
    <path d="M43 71h10" stroke="url(#phone-gradient)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Código -->
  <rect x="18" y="36" width="60" height="23" rx="6" fill="white" stroke="#E4E7FF"/>
  <path d="M34 43.2v9.1M30.1 46.1h7.8M30.8 52l6.4-8.6M37.2 52l-6.4-8.6" stroke="url(#phone-gradient)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M49.5 43.2v9.1M45.6 46.1h7.8M46.3 52l6.4-8.6M52.7 52l-6.4-8.6" stroke="url(#phone-gradient)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M65 43.2v9.1M61.1 46.1h7.8M61.8 52l6.4-8.6M68.2 52l-6.4-8.6" stroke="url(#phone-gradient)" stroke-width="2.4" stroke-linecap="round"/>
</svg>
